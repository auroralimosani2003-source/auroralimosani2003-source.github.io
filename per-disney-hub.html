<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Limosani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --azure:#fbeeee;--violet:#a3b4db;--rose:#cadff8;
    --deep:#14213f;--cream:#faf8f6;--ink:#16111f;
    --mid:#0c032b;
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Inter',sans-serif;
  }
  html,body{height:100%}
  body{
    background:var(--cream);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    padding:2rem;
  }
  .wrap{max-width:640px;width:100%;text-align:center}
  .eyebrow{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mid);margin-bottom:1.5rem}
  h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;margin-bottom:.6rem}
  h1 em{font-style:italic;color:var(--deep)}
  .sub{font-size:.92rem;color:var(--mid);line-height:1.7;max-width:44ch;margin:0 auto 3rem;font-weight:300}
  .links{display:flex;flex-direction:column;gap:1rem}
  .card{
    display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
    padding:1.6rem 2rem;border:1px solid rgba(20,33,63,.15);border-radius:16px;
    text-decoration:none;color:inherit;text-align:left;
    transition:border-color .3s,transform .3s,background .3s;
  }
  .card:hover{border-color:var(--deep);transform:translateY(-2px);background:rgba(163,180,219,.08)}
  .card-title{font-family:var(--serif);font-weight:700;font-size:1.15rem;margin-bottom:.3rem}
  .card-desc{font-size:.82rem;color:var(--mid);font-weight:300}
  .arrow{font-size:1.3rem;color:var(--deep);flex-shrink:0}
  .card.highlight{border-color:var(--deep);background:rgba(163,180,219,.10)}
  footer{margin-top:3rem;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid)}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Content Creator &amp; Digital Strategist</p>
    <h1>Aurora <em>Limosani</em></h1>
    <p class="sub">Una lettera e un progetto pensati apposta per questa candidatura.</p>
    <div class="links">
      <a class="card highlight" href="/per-disney/lettera/">
        <div>
          <div class="card-title">Dear Disney</div>
          <div class="card-desc">La mia lettera di candidatura, scritta apposta per voi</div>
        </div>
        <span class="arrow">→</span>
      </a>
      <a class="card" href="/espresso-yourself/">
        <div>
          <div class="card-title">Espresso Yourself</div>
          <div class="card-desc">Il bar interattivo delle mie competenze creative</div>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>
    <footer>© 2026 Aurora Limosani</footer>
  </div>
</body>
</html>
